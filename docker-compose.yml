name: radarku

services:
  postgres:
    image: postgres:16-alpine
    container_name: radarku_dev_db
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: radarku_dev_2026
      POSTGRES_DB: radarku_dev_db
    volumes:
      - radarku_dev:/var/lib/postgresql/data

volumes:
  radarku_dev:
