version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sipeka-db
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: minamutu_dev_2026
      POSTGRES_DB: sipeka
    volumes:
      - sipeka_pgdata:/var/lib/postgresql/data

volumes:
  sipeka_pgdata:
